    <!-- Tailwind CSS CDN + Typography plugin: carregamos ambos e registramos
         o plugin explicitamente para garantir que as classes .prose funcionem -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://unpkg.com/@tailwindcss/typography@0.5.15/dist/typography.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            plugins: [window.tailwindcss?.plugin?.typography].filter(Boolean),
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked JS for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for clean operational layout */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            body {
                background: white !important;
                color: black !important;
            }

            .print-container {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
        }

        @keyframes pulse-subtle {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Estilos para callouts vindos do Notion (convertidos para blockquote) */
        .notion-callout {
            border-left: 4px solid #0ea5e9;
            background-color: #f0f9ff;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .dark .notion-callout {
            background-color: rgba(14, 165, 233, 0.15);
            border-left-color: #38bdf8;
        }

        .notion-callout p {
            margin: 0;
        }

        /* Listas numeradas: deixa o browser e o Tailwind prose gerenciarem a
           numeração nativamente — respeita o atributo HTML start= */
        .prose ol {
            list-style-type: decimal;
        }

        .prose ol>li,
        .prose ul>li {
            margin-top: 0.25rem;
            margin-bottom: 0.25rem;
        }

        /* Fallback explícito para títulos gerados pelo markdown do Notion:
           garante que h1–h6 tenham peso, tamanho e cor diferenciados mesmo se
           o plugin Typography não carregar corretamente. */
        .prose h1,
        .prose h2,
        .prose h3,
        .prose h4,
        .prose h5,
        .prose h6 {
            font-weight: 700;
            line-height: 1.25;
            color: #0f172a;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .dark .prose h1,
        .dark .prose h2,
        .dark .prose h3,
        .dark .prose h4,
        .dark .prose h5,
        .dark .prose h6 {
            color: #f8fafc;
        }

        .prose h1 {
            font-size: 1.75rem;
        }

        .prose h2 {
            font-size: 1.5rem;
        }

        .prose h3 {
            font-size: 1.25rem;
        }

        .prose h4 {
            font-size: 1.125rem;
        }

        .prose h5 {
            font-size: 1rem;
        }

        .prose h6 {
            font-size: 0.875rem;
        }

        /* O primeiro título do conteúdo não precisa de margem superior grande */
        .prose>h1:first-child,
        .prose>h2:first-child,
        .prose>h3:first-child,
        .prose>h4:first-child {
            margin-top: 0;
        }
    </style>
</head>

    <script>
        // DADOS DO BANCO
        let sopDatabase = [];
        let filteredSops = [];
        let currentSopForModal = null;

        // Configura o Marked para suportar tabelas, quebras de linha e HTML embutido
        if (typeof marked !== 'undefined') {
            marked.use({
                gfm: true,
                breaks: true,
                headerIds: false,
                mangle: false
            });
        }

        /**
         * Normaliza listas numeradas adjacentes no markdown. Quando o Notion gera
         * duas listas numeradas seguidas sem separacao, o marked as junta em uma
         * unica <ol> e a numeracao continua. Inserimos um separador invisivel
         * (comentario HTML) para forcar <ol> distintas.
         */
        /**
         * Normaliza listas numeradas vindas do notion-to-md:
         * - Remove linhas em branco entre itens sequenciais (notion-to-md às vezes
         *   insere blanks entre itens de uma mesma lista)
         * - Insere separador HTML quando uma nova lista reinicia a partir de 1
         * - Preserva linhas em branco ao redor de títulos (h1–h6) e divisores
         */
        const headingReg = /^(#{1,6})\s+.+$/;
        const dividerReg = /^-{3,}\s*$/;
        const numReg = /^( *)(\d+)\. /;

        function isHeadingOrDivider(line) {
            return headingReg.test(line.trim()) || dividerReg.test(line.trim());
        }

        function normalizeNumberedLists(md) {
            const lines = md.split('\n');
            const result = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.trim() === '' && i + 1 < lines.length) {
                    // Acha o último item não-vazio no resultado
                    let lastNonBlank = '';
                    for (let k = result.length - 1; k >= 0; k--) {
                        if (result[k].trim() !== '') { lastNonBlank = result[k]; break; }
                    }
                    // Acha o próximo item não-vazio à frente
                    let nextIdx = i + 1;
                    while (nextIdx < lines.length && lines[nextIdx].trim() === '') nextIdx++;
                    const nextLine = nextIdx < lines.length ? lines[nextIdx] : '';

                    // Nunca compacta em torno de títulos/divisores para não
                    // prejudicar o parsing do marked/Tailwind prose
                    if (isHeadingOrDivider(lastNonBlank) || isHeadingOrDivider(nextLine)) {
                        result.push(line);
                        continue;
                    }

                    const prevM = lastNonBlank.match(numReg);
                    const nextM = nextLine.match(numReg);

                    if (prevM && nextM && prevM[1] === nextM[1]) {
                        const prevNum = parseInt(prevM[2], 10);
                        const nextNum = parseInt(nextM[2], 10);

                        if (nextNum === prevNum + 1) {
                            // Sequência contínua — remove a(s) linha(s) em branco
                            i = nextIdx - 1;
                            continue;
                        }
                        if (nextNum === 1 && prevNum > 1) {
                            // Nova lista reiniciando — garante separador visível
                            result.push('');
                            result.push('<!-- list-break -->');
                            result.push('');
                            i = nextIdx - 1;
                            continue;
                        }
                    }
                }

                result.push(line);
            }

            return result.join('\n');
        }

        /**
         * Renderiza markdown do Notion para HTML, preservando callouts, tabelas
         * e garantindo que listas numeradas reiniciem a contagem.
         * Links contendo ?pop=ID são transformados em links internos que abrem
         * a POP correspondente dentro do portal (sem sair da página).
         */
        function renderNotionMarkdown(mdContent) {
            const md = normalizeNumberedLists(mdContent || '*Nenhum conteúdo encontrado para este processo.*');
            // Debug: descomente a linha abaixo no console do navegador para inspecionar
            // console.log('[renderNotionMarkdown] markdown:', md);
            const rawHtml = marked.parse(md);

            // Transforma blockquotes de callouts do Notion em divs estilizadas
            let html = rawHtml.replace(
                /<blockquote>\s*(<p>)?\s*(\p{Emoji})\s*<strong>Aviso:<\/strong>\s*(.*?)\s*(<\/p>)?\s*<\/blockquote>/gus,
                '<div class="notion-callout"><p>$2 <strong>Aviso:</strong> $3</p></div>'
            );

            // Marca links internos (?pop=...) para abrir no modal do portal
            html = html.replace(
                /<a href="([^"]*\?pop=([^"&]+))"([^>]*)>/gi,
                '<a href="?pop=$2" class="internal-pop-link" data-pop-id="$2"$3>'
            );

            return html;
        }

        async function fetchSops() {
            try {
                const response = await fetch('/api/sops');
                if (!response.ok) throw new Error('Falha ao conectar na API');
                sopDatabase = await response.json();
                filteredSops = [...sopDatabase];
                populateFilterDropdowns();
                renderSopCards();
            } catch (error) {
                console.error('Erro ao buscar processos:', error);
                document.getElementById('sops-grid').innerHTML = '<div class="col-span-full text-center text-red-500 py-10">Erro ao carregar processos. Verifique se o servidor está rodando (npm run dev).</div>';
            }
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
        }

        function populateFilterDropdowns() {
            const macroSelect = document.getElementById('filter-macro');
            const subSelect = document.getElementById('filter-sub');

            const macros = [...new Set(sopDatabase.map(s => s.areaMacro))];
            const subs = [...new Set(sopDatabase.map(s => s.subcategoria))];

            macroSelect.innerHTML = '<option value="">Todos os Setores</option>' + macros.map(m => `<option value="${m}">${m}</option>`).join('');
            subSelect.innerHTML = '<option value="">Todas as Categorias</option>' + subs.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const macro = document.getElementById('filter-macro').value;
            const sub = document.getElementById('filter-sub').value;

            filteredSops = sopDatabase.filter(sop => {
                const matchMacro = !macro || sop.areaMacro === macro;
                const matchSub = !sub || sop.subcategoria === sub;
                const matchText = !searchTerm || sop.codigo.toLowerCase().includes(searchTerm) || sop.titulo.toLowerCase().includes(searchTerm);
                return matchMacro && matchSub && matchText;
            });

            renderSopCards();
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-macro').value = '';
            document.getElementById('filter-sub').value = '';
            applyFilters();
        }

        function renderSopCards() {
            const container = document.getElementById('sops-grid');
            document.getElementById('sop-count').textContent = filteredSops.length;

            if (filteredSops.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            document.getElementById('empty-state').classList.add('hidden');
            container.innerHTML = filteredSops.map(sop => `
                <div onclick="openSopModal('${sop.id}')" class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-brand-500 transition cursor-pointer flex flex-col justify-between group">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-mono font-bold px-2 py-0.5 rounded bg-brand-50 dark:bg-brand-950/70 text-brand-700 dark:text-brand-300 border border-brand-200 dark:border-brand-800">${sop.codigo}</span>
                            <span class="text-slate-400 text-xs">${sop.lastEdited}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white text-base group-hover:text-brand-600 transition">${sop.titulo}</h3>
                        <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2">${sop.objetivo}</p>
                    </div>
                </div>
            `).join('');
        }

        async function openSopModal(id) {
            const sop = sopDatabase.find(s => s.id === id);
            if (!sop) return;
            currentSopForModal = sop;
            document.getElementById('modal-code-badge').textContent = sop.codigo;
            document.getElementById('modal-title').textContent = sop.titulo;
            document.getElementById('modal-macro').textContent = sop.areaMacro;
            document.getElementById('modal-sub').textContent = sop.subcategoria;
            const responsaveis = Array.isArray(sop.responsavel) && sop.responsavel.length
                ? sop.responsavel.join(', ')
                : (sop.responsavel || 'Não informado');
            document.getElementById('modal-resp').textContent = responsaveis;
            document.getElementById('modal-body').innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-brand-500 text-2xl"></i><p class="text-xs text-slate-500 mt-2">Carregando conteúdo...</p></div>';
            document.getElementById('sop-modal').classList.remove('hidden');

            try {
                const response = await fetch(`/api/sops/${id}/content`);
                if (!response.ok) throw new Error('Erro ao buscar conteúdo');
                const data = await response.json();
                document.getElementById('modal-body').innerHTML = renderNotionMarkdown(data.content);
            } catch (err) {
                document.getElementById('modal-body').innerHTML = '<div class="text-red-500 text-sm">Erro ao carregar o conteúdo do processo.</div>';
            }
        }

        function closeSopModal() {
            document.getElementById('sop-modal').classList.add('hidden');
        }

        // Intercepta cliques em links internos (?pop=ID) dentro do conteúdo do modal
        document.getElementById('modal-body').addEventListener('click', function (e) {
            const link = e.target.closest('a.internal-pop-link');
            if (!link) return;

            const popId = link.getAttribute('data-pop-id');
            if (popId) {
                e.preventDefault();
                openSopModal(popId);
                // Atualiza a URL sem recarregar a página
                window.history.pushState({}, '', '?pop=' + encodeURIComponent(popId));
            }
        });

        window.onload = async function () {
            initTheme();
            await fetchSops();
            const params = new URLSearchParams(window.location.search);
            const popId = params.get('pop');
            if (popId) {
                openSopModal(popId);
            }
        };
    </script>
</body>

</html>
